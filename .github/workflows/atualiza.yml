name: Atualiza painéis

# Disparo principal: cron-job.org -> workflow_dispatch (o schedule nativo do Actions pode atrasar
# mais de 1 h em repositório gratuito; fica como rede de segurança).
on:
  repository_dispatch:
    types: [atualiza]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      bacias:
        description: 'Bacias a atualizar, separadas por espaço (vazio = todas de config/bacias.yaml)'
        required: false
        default: ''
      backfill_ons:
        description: 'Backfill horário do ONS a partir de AAAA-MM (vazio = só mês corrente e anterior)'
        required: false
        default: ''
      dias_telemetria:
        description: 'Janela da telemetria em dias (padrão 7; máx. 60)'
        required: false
        default: '7'
      merge_desde:
        description: 'Backfill do MERGE a partir de AAAA-MM-DD (vazio = últimos 10 dias)'
        required: false
        default: ''

concurrency:
  group: atualiza
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar e montar cada bacia
        run: |
          BACIAS="${{ github.event.inputs.bacias }}"
          if [ -z "$BACIAS" ]; then
            BACIAS=$(python -c "import yaml;print(' '.join(b['slug'] for b in yaml.safe_load(open('config/bacias.yaml'))['bacias']))")
          fi
          for B in $BACIAS; do
            echo "::group::$B"
            export BACIA=$B
            # cada fonte pode falhar sem derrubar as outras: o status.json da bacia registra a falha
            if [ -n "${{ github.event.inputs.backfill_ons }}" ]; then
              python coleta/ons.py --desde "${{ github.event.inputs.backfill_ons }}" || echo "ONS falhou em $B"
            else
              python coleta/ons.py || echo "ONS falhou em $B"
            fi
            python coleta/telemetria.py --dias "${{ github.event.inputs.dias_telemetria || '7' }}" || echo "telemetria falhou em $B"
            if [ -n "${{ github.event.inputs.merge_desde }}" ]; then
              python coleta/merge.py --desde "${{ github.event.inputs.merge_desde }}" || echo "MERGE falhou em $B"
            else
              python coleta/merge.py || echo "MERGE falhou em $B"
            fi
            python coleta/monta_site.py
            echo "::endgroup::"
          done
          python coleta/publica_inicio.py

      - name: Publicar dados
        run: |
          git config user.name "paineis-bacias[bot]"
          git config user.email "paineis-bacias@users.noreply.github.com"
          git add dados docs
          if git diff --cached --quiet; then
            echo "sem mudanças"; exit 0
          fi
          git commit -m "dados: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M') BRT"
          git pull --rebase
          git push
