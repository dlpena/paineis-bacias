# Usinas da bacia do Paranapanema no conjunto "dados_hidrologicos_ho" do ONS (nom_bacia = PARANAPANEMA), de montante
# para jusante no rio principal, e Mauá (Gov. Jayme Canet Jr.) no rio Tibagi, que deságua no reservatório de Capivara.
# ons / id_ons / cod_usina: lidos no parquet DADOS_HIDROLOGICOS_HO_2026_09 (22/09/2026).
# tipo e coordenadas: cadastro de reservatórios do ONS (dataset reservatorio, RESERVATORIOS.csv, 22/09/2026),
# tip_reservatorio "RESERVATÓRIO COM USINA" = acumulacao, "FIO DAGUA" = fio_dagua; val_latitude/val_longitude.
# estacao_barramento: estação fluviométrica "BARRAMENTO" da própria usina no catálogo da Resolução Conjunta nº 3.
# nome: como no art. 1º da outorga ANA; Mauá: "UHE GOV. JAYME CANET JUNIOR" (Res. Conjunta nº 3) e "MAUA" (SAR/ANA).
# agente: titular da outorga ANA lida (repositorio_usina, 22/09/2026); Piraju, Ourinhos e Mauá sem outorga ANA no
# repositório: agente pelo cadastro SIGA/ANEEL (referencia_usina), a confirmar.
usinas:
  - slug: jurumirim
    ons: JURUMIRIM
    id_ons: PPJURU
    cod_usina: 47
    nome: Jurumirim (Armando Avellanal Laydner)
    curto: Jurumirim
    tipo: acumulacao
