titulo_inicio: O rio Paranapanema agora
apresentacao: >-
  A bacia do Paranapanema, da cabeceira no sul de São Paulo ao rio Paraná, na divisa com Mato Grosso do Sul: onze usinas
  do ONS em cascata no rio principal, mais Mauá no rio Tibagi, e as estações fluviométricas da ANA, com o valor da
  última hora. Passe o mouse para ler cada ponto.
resumo_inicial: >-
  Da cabeceira no sul de São Paulo ao rio Paraná: onze usinas em cascata na divisa SP/PR, mais Mauá no Tibagi,
  com as faixas de operação da Resolução ANA nº 132/2022 em Jurumirim, Chavantes e Capivara.

