fontes:
  usinas: >-
    Bacia <code>PARANAPANEMA</code>: Jurumirim, Piraju, Paranapanema, Chavantes, Ourinhos, Salto Grande, Canoas II,
    Canoas I, Capivara, Taquaruçu e Rosana no rio principal, e Gov. Jayme Canet Jr. (Mauá) no rio Tibagi.
  poligono: >-
    ANA/SNIRH, serviço "Divisões de bacias hidrográficas", camada Meso Região Hidrográfica, código DME_CD 11149
    ("Paranapanema"), com 107.375 km² pelo atributo DME_AR_KM2 do próprio serviço.
  limites: >-
    Outorgas ANA vigentes, texto lido no DOU em 22/09/2026: nº 219/2021 (Jurumirim), nº 308/2021 (Paranapanema),
    nº 188/2021 (Chavantes), nº 2.096/2020 (Salto Grande), nº 1.186/2021 (Canoas II), nº 1.185/2021 (Canoas I),
    nº 1.385/2021 (Capivara), nº 1.386/2021 (Taquaruçu) e nº 1.384/2021 (Rosana); nenhuma fixa vazão mínima defluente.
    Piraju, Ourinhos e Mauá ficam sem limite: não há outorga da ANA para elas no acervo consultado. Resolução ANA nº
    132/2022 (condições de operação do Sistema Hídrico do Paranapanema), texto integral lido: faixas de operação por
    nível em Jurumirim, Chavantes e Capivara, com vazão defluente máxima média semanal em cada faixa, semana de sábado a
    sexta definida pelo nível da sexta anterior e tolerância de 5%. A resolução não diz a hora da consulta de sexta: o
    painel usa o nível diário do ONS da sexta. Formulários FSAR-H desta bacia ainda não lidos para o painel.
  zeros: ""
rodape_regras: >-
  Limites lidos nos documentos primários: outorgas ANA de nove usinas e Resolução ANA nº 132/2022; FSAR-H desta bacia
  ainda não lidos.
