# Piraju, Ourinhos e Mauá: sem outorga da ANA no repositório (a confirmar se são de domínio estadual ou só não coletadas).
# Resolução ANA nº 132/2022 (condições de operação de Jurumirim, Chavantes e Capivara): texto integral lido em
