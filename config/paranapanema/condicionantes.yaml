  # ---------------- Resolução ANA nº 132/2022: faixas de operação por nível e vazão defluente máxima média semanal
  # Cada faixa vale do seu nível (nivel_de, inclusive) até o nível da faixa de cima. A faixa é definida a cada semana
  # operativa (sábado a sexta) pela situação do reservatório na sexta-feira anterior (art. 8º); tolerância de 5% sobre
  # as vazões (art. 10). A resolução não diz a hora da consulta de sexta: o painel usa o nível diário do ONS da sexta.
  - id: jur-faixas
    usina: jurumirim
    variavel: defluencia
    tipo: faixas
    titulo: Faixas de operação por nível do reservatório, com vazão defluente máxima média semanal em cada faixa
    fonte: "Resolução ANA nº 132/2022, arts. 2º e 3º, 8º e 10"
    vigencia: desde 01/01/2023
    tolerancia_pct: 5
    faixas:
      - {nome: Normal, nivel_de: 563.35, vu_pct: 40, qmax_semanal: null}
      - {nome: Atenção, nivel_de: 562.48, vu_pct: 30, qmax_semanal: 182}
      - {nome: Alerta, nivel_de: 562.04, vu_pct: 25, qmax_semanal: 147}
      - {nome: Restrição, nivel_de: 559.7, vu_pct: 0, qmax_semanal: 90}
  - id: chv-faixas
    usina: chavantes
    variavel: defluencia
    tipo: faixas
    titulo: Faixas de operação por nível do reservatório, com vazão defluente máxima média semanal em cada faixa
    fonte: "Resolução ANA nº 132/2022, arts. 4º e 5º, 8º e 10"
    vigencia: desde 01/01/2023
    tolerancia_pct: 5
    faixas:
